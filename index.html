<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063d2b"><meta name="description" content="বাংলাদেশের খবর এক জায়গায়"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>বাংলাদেশ নিউজ হাব</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17251e;--muted:#637269;--green:#087a52;--line:#e0e8e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:#063d2b;color:#fff;padding:25px max(16px,calc((100vw - 1050px)/2)) 22px}.brand{font-size:12px;letter-spacing:.1em;color:#bfe9d5}.hero{font-size:clamp(27px,5vw,42px);font-weight:800;margin:8px 0 4px}.sub{color:#d5e9df;font-size:14px}.wrap{max-width:1050px;margin:auto;padding:16px}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:11px 14px;flex:1;min-width:120px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.bar input{flex:1;min-width:170px}.bar input,.bar select{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.chips button{border:1px solid var(--line);background:white;border-radius:24px;padding:8px 12px;white-space:nowrap;font:inherit}.chips button.active{background:var(--green);color:white}.meta{font-size:12px;color:var(--muted);margin:6px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.story{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column}.tag{align-self:flex-start;border-radius:20px;background:#e8f5ed;color:var(--green);font-size:11px;font-weight:700;padding:5px 9px}.story h2{font-size:18px;line-height:1.55;margin:10px 0 7px}.story p{font-size:14px;line-height:1.7;color:#47564d;margin:0 0 13px}.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:auto;font-size:12px;color:var(--muted)}a{color:var(--green);font-weight:700;text-decoration:none}.source-list{font-size:11px;color:var(--muted);margin-top:8px}.notice{background:#fff8e8;border:1px solid #efdfb9;padding:12px;border-radius:11px;font-size:12px;line-height:1.6;margin:14px 0}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.story h2{font-size:17px}}
.news-photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin:10px 0} .photo-slot:empty{display:none}
</style></head><body><header><div class="brand">BANGLADESH NEWS HUB</div><div class="hero">আজকের বাংলাদেশ</div><div class="sub">বিভিন্ন সংবাদমাধ্যমের গুরুত্বপূর্ণ খবর—এক জায়গায়</div></header><main class="wrap">
<div class="stats"><div class="stat"><b id="total">—</b><span>আজকের খবর</span></div><div class="stat"><b id="sources">—</b><span>সক্রিয় সংবাদসূত্র</span></div><div class="stat"><b id="updated">—</b><span>সর্বশেষ আপডেট</span></div></div>
<div class="notice" id="status">সর্বশেষ সংবাদ সংস্করণ লোড হচ্ছে…</div>
<div class="bar"><input id="q" placeholder="খবর খুঁজুন…"><select id="edition"><option value="today">সর্বশেষ সংস্করণ</option></select></div><div class="chips" id="filters"></div><div class="meta" id="count"></div><section class="grid" id="stories"></section></main>
<script>
let all=[],active='সব';const categories=['সব','জাতীয়','রাজনীতি','সারাদেশ','অপরাধ','অর্থনীতি','শিক্ষা','স্বাস্থ্য','আন্তর্জাতিক','খেলা','প্রযুক্তি'];
const filters=document.getElementById('filters'),grid=document.getElementById('stories');
categories.forEach(c=>{const b=document.createElement('button');b.textContent=c;if(c==='সব')b.className='active';b.onclick=()=>{active=c;[...filters.children].forEach(x=>x.classList.toggle('active',x===b));render()};filters.appendChild(b)});
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const rows=all.filter(x=>(active==='সব'||x.category===active)&&(!q||(x.title+x.category+(x.sources||[]).map(s=>s.name).join(' ')).toLowerCase().includes(q)));document.getElementById('count').textContent=rows.length+'টি খবর';grid.innerHTML='';if(!rows.length){grid.innerHTML='<div class="empty">এই বিভাগে এখনো খবর নেই।</div>';return}rows.forEach(x=>{const el=document.createElement('article');el.className='story';el.innerHTML='<span class="tag"></span><div class="photo-slot"></div><h2></h2><div class="foot"><span></span><a target="_blank" rel="noopener">মূল খবর ↗</a></div><div class="source-list"></div>';el.querySelector('.tag').textContent=x.category||'জাতীয়';el.querySelector('h2').textContent=x.title;if(x.image && /^https?:\/\//i.test(x.image)){const img=document.createElement('img');img.src=x.image;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.className='news-photo';el.querySelector('.photo-slot').appendChild(img);}const ss=x.sources||[];el.querySelector('.foot span').textContent=ss[0]?.name||'সংবাদসূত্র';el.querySelector('a').href=ss[0]?.url||x.url||'#';el.querySelector('.source-list').textContent=ss.length>1?'আরও সূত্র: '+ss.slice(1).map(s=>s.name).join(', '):'';grid.appendChild(el)})}
async function load(){try{const r=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('news.json not ready');const d=await r.json();all=d.stories||[];document.getElementById('total').textContent=d.count??all.length;document.getElementById('sources').textContent=(d.feed_status||[]).filter(s=>s.ok).length;document.getElementById('updated').textContent=d.updated_at?new Date(d.updated_at).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dhaka'}):'—';document.getElementById('status').textContent='সংস্করণ: '+(d.edition_date||'—')+' · '+(d.summary_mode||'')+' · সময়: বাংলাদেশ';render()}catch(e){document.getElementById('status').textContent='সংবাদ ডেটা পাওয়া যায়নি। GitHub Actions থেকে প্রথম আপডেট চালান।';grid.innerHTML='<div class="empty">প্রথম স্বয়ংক্রিয় সংবাদ সংগ্রহের অপেক্ষায়।</div>'}}
document.getElementById('q').addEventListener('input',render);load();setInterval(load,5*60*1000);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
